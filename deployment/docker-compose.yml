# Инфраструктура проекта. Запуск из корня репозитория:
# docker compose -f deployment/docker-compose.yml --env-file .env up -d
# Постепенно добавляются kafka, api, worker, интерфейс, мониторинг (блок 5 требований).

services:
  postgres:
    image: postgres:16-alpine
    container_name: ar1c-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_risk}
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-academic_risk}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ar1c-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
